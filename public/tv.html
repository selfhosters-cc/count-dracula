<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Count Dracula — TV</title>
  <link rel="stylesheet" href="/vendor/fonts/fonts.css">
  <style>
    /* Layout A "Scoreboard" (spec §7), from the TV prototype (commit 1d78274). Built for 1920×1080. */
    :root {
      color-scheme: dark;
      --night: #140f26;
      --night-2: #1f1838;
      --ink: #f7efe0;
      --ink-dim: #b3aacb;
      --pumpkin: #ff7a1a;
      --grid: #2c2449;
      --f-display: "Bungee", "Arial Black", Impact, sans-serif;
      --f-spooky: "Creepster", "Bungee", Impact, fantasy;
      --f-body: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--night); color: var(--ink); font-family: var(--f-body); overflow: hidden; cursor: none; }
    .num { font-variant-numeric: tabular-nums; }
    .eyebrow { font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); font-size: clamp(11px, 1.4vw, 22px); }

    /* The frame. Padding keeps key content off the outer ~5% (TV overscan). */
    #board { position: fixed; inset: 0; padding: 4.5vh 4.5vw; display: grid;
      grid-template-columns: 34fr 66fr; grid-template-rows: auto 1fr 22vh 10vh; gap: 1.6vh 2vw; }
    .top { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 1em; }
    .title { font-family: var(--f-spooky); font-size: clamp(20px, 3.4vw, 64px); color: var(--pumpkin); letter-spacing: .03em; }
    .golden-pill { display: inline-flex; align-items: center; gap: .4em; padding: .3em .8em; border-radius: 999px;
      border: 2px solid #ffcf3a; color: #ffcf3a; font-weight: 700; font-size: clamp(12px, 1.8vw, 30px); white-space: nowrap; }
    .golden-pill[hidden] { display: none; }
    .golden-pill b { font-family: var(--f-display); font-weight: 400; }
    #board.ended .golden-pill, #board.ended .clock { display: none; }
    .muted { font-size: clamp(14px, 2vw, 34px); opacity: .8; }
    .muted[hidden] { display: none; }
    .clock { font-family: var(--f-display); font-size: clamp(14px, 2.2vw, 36px); color: var(--ink-dim); }
    .hero { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
    .hero .big { font-family: var(--f-display); font-size: clamp(64px, 15vw, 300px); line-height: .9; }
    .pace { margin-top: 1.2vh; font-size: clamp(14px, 2.2vw, 40px); font-weight: 600; min-height: 1.3em; }
    /* The rush meter (ticket 39): kids per minute over the last 5 minutes, up to 6/min */
    .rush { margin-top: 2vh; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: .3em 1em;
      font-size: clamp(12px, 1.4vw, 26px); color: var(--ink-dim); max-width: 26em; }
    .rush[hidden] { display: none; }
    .rush .label { font-family: var(--f-display); white-space: nowrap; }
    .rush .gauge { height: .7em; border-radius: 999px; background: var(--grid); overflow: hidden; }
    .rush .fill { height: 100%; width: 0; border-radius: 999px; background: var(--ink-dim); transition: width .8s ease, background .8s; }
    .rush.busy .label { color: #ffcf3a; } .rush.busy .fill { background: #ffcf3a; }
    .rush.rush .label { color: var(--pumpkin); } .rush.rush .fill { background: var(--pumpkin); }
    .rush .rate { grid-column: 2; font-size: .8em; }
    .chartbox { min-width: 0; min-height: 0; background: var(--night-2); border-radius: 14px; padding: 1.4vh 1vw 1vh;
      display: flex; flex-direction: column; }
    .chartbox .legend { display: flex; gap: 2em; color: var(--ink-dim); font-weight: 600; font-size: clamp(12px, 1.2vw, 22px); }
    .chartbox .legend:empty { display: none; }
    .chartbox .legend i { display: inline-block; width: 2.2em; height: 0; vertical-align: middle; margin-right: .5em; }
    .chartbox .plot { position: relative; flex: 1; min-height: 0; }
    .boardbox { grid-column: 1 / -1; min-width: 0; min-height: 0; display: flex; flex-direction: column;
      font-size: clamp(11px, 1.25vw, 24px); }
    #board.no-leaderboard { grid-template-rows: auto 1fr 10vh; }
    #board.no-leaderboard .boardbox { display: none; }
    #board.no-patch { grid-template-rows: auto 1fr 22vh; }
    #board.no-patch.no-leaderboard { grid-template-rows: auto 1fr; }
    #board.no-patch .patchbox { display: none; }
    .patchbox canvas { width: 100%; height: 100%; display: block; }
    .rows { position: relative; flex: 1; margin-top: .5em; }
    .lb-row { position: absolute; left: 0; right: 0; height: 18%; display: grid; grid-template-columns: minmax(0, 14em) 1fr;
      align-items: center; gap: .8em; transition: top .6s cubic-bezier(.4, 1.4, .5, 1); }
    .lb-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    .lb-track { position: relative; height: 70%; }
    .lb-bar { position: absolute; left: 0; top: 0; bottom: 0; min-width: 6px; border-radius: 0 6px 6px 0;
      transition: width .6s cubic-bezier(.4, 1.4, .5, 1); }
    .lb-val { position: absolute; top: 50%; transform: translateY(-50%); font-family: var(--f-display); padding-left: .4em;
      transition: left .6s cubic-bezier(.4, 1.4, .5, 1); }
    .lb-empty { color: var(--ink-dim); margin-top: .5em; }
    /* The recap: the leaderboard row becomes four stat cards (spec §7 Ended) */
    .cards { display: none; grid-template-columns: repeat(4, 1fr); gap: 1.4vw; flex: 1; margin-top: .5em; }
    #board.recap .cards { display: grid; }
    #board.recap .rows, #board.recap .boardbox > .eyebrow { display: none; }
    #board.recap.no-leaderboard { grid-template-rows: auto 1fr 22vh 10vh; }
    #board.recap.no-leaderboard .boardbox { display: flex; }
    .card { background: var(--night-2); border-radius: 14px; padding: 1.4vh 1.2vw; display: flex; flex-direction: column; gap: .6vh; min-width: 0; }
    .card .k { color: var(--ink-dim); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: clamp(10px, 1vw, 18px); }
    .card .v { font-family: var(--f-display); font-size: clamp(16px, 2vw, 38px); line-height: 1.1; overflow: hidden; text-overflow: ellipsis; }
    .card .s { color: var(--ink-dim); font-size: clamp(11px, 1.1vw, 20px); }
    .card .tickets { display: flex; flex-wrap: wrap; gap: .3em .6em; font-family: var(--f-display); font-size: clamp(14px, 1.6vw, 30px); color: #ffcf3a; }
    .card .tickets .unclaimed { color: var(--ink-dim); opacity: .55; }
    .card .tickets small { font-family: var(--f-body); font-size: .5em; color: var(--ink-dim); }
    .patchbox { grid-column: 1 / -1; min-width: 0; border-top: 2px solid var(--grid); }

    #count { display: inline-block; transform-origin: left center; }

    /* Celebration layer */
    #pop { position: fixed; left: 50%; top: 56%; translate: -50% -50%; opacity: 0; pointer-events: none; z-index: 30;
      text-align: center; padding: .25em .7em; border-radius: 24px; background: var(--pumpkin); color: #1d0d00;
      font-family: var(--f-display); font-size: clamp(30px, 7vw, 140px); line-height: 1; white-space: nowrap;
      box-shadow: 0 10px 60px rgba(255, 122, 26, .55); }
    #pop small { display: block; font-family: var(--f-body); font-weight: 700; font-size: .28em; letter-spacing: .14em;
      text-transform: uppercase; margin-bottom: .2em; }
    /* Every 50th: a headstone rises out of the ground with the milestone carved on it */
    #tomb { position: fixed; left: 50%; bottom: 4vh; width: min(30vw, 46vh); translate: -50% 0; z-index: 30;
      pointer-events: none; transform: translateY(120%); filter: drop-shadow(0 18px 40px rgba(0, 0, 0, .6)); }
    #tomb svg { width: 100%; height: auto; display: block; overflow: visible; }
    #tomb.big { width: min(40vw, 64vh); bottom: 0; z-index: 41; } /* above the takeover's backdrop */
    #takeover.with-tomb { place-content: start center; padding-top: 7vh; }
    #takeover.with-tomb .h { font-size: clamp(40px, 7vw, 140px); }
    #tomb .carved { font-family: var(--f-display); fill: #3b3848; }
    #tomb .lit { font-family: var(--f-display); fill: #c7c2d6; }
    #tomb .spooky { font-family: var(--f-spooky); }
    #takeover { position: fixed; inset: 0; z-index: 40; display: grid; place-content: center; text-align: center; padding: 6vh 6vw;
      background: radial-gradient(circle at 50% 45%, #3a1d00, #0a0614 75%); opacity: 0; pointer-events: none; }
    #takeover .k { font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-dim); font-size: clamp(14px, 2.4vw, 44px); }
    #takeover .h { font-family: var(--f-spooky); font-size: clamp(56px, 13vw, 260px); line-height: .95; color: var(--pumpkin); text-wrap: balance; }
    #takeover .s { font-family: var(--f-display); font-size: clamp(18px, 3.2vw, 64px); margin-top: 2vh; }
    #takeover.gold { background: radial-gradient(circle at 50% 45%, #6b4a00, #120a00 75%); }
    #takeover.gold .h { color: #ffcf3a; }
    #banner { position: fixed; left: 0; right: 0; top: 0; z-index: 31; transform: translateY(-110%); background: var(--night-2);
      border-bottom: 4px solid var(--pumpkin); padding: 2.5vh 5vw; display: flex; align-items: center; gap: 2vw; pointer-events: none; }
    #banner .t1 { font-family: var(--f-spooky); color: var(--pumpkin); font-size: clamp(22px, 4vw, 76px); white-space: nowrap; }
    #banner .t2 { font-family: var(--f-display); font-size: clamp(22px, 4.2vw, 80px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #fx { position: fixed; inset: 0; pointer-events: none; z-index: 35; overflow: hidden; }
    #fx .flyer { position: absolute; top: 0; opacity: 0; will-change: transform; }
    #fx .shout { position: absolute; left: 50%; top: 22%; translate: -50% 0; font-family: var(--f-spooky); white-space: nowrap;
      font-size: clamp(40px, 9vw, 180px); color: var(--ink); text-shadow: 0 0 30px #7a3cff; }
    /* The idle teaser: the new-costume banner, toned down (spec §7 States) */
    #teaser { position: fixed; left: 0; right: 0; top: 0; z-index: 30; transform: translateY(-110%); background: var(--night-2);
      border-bottom: 2px solid var(--grid); padding: 1.6vh 5vw; pointer-events: none; text-align: center;
      font-size: clamp(16px, 2.4vw, 46px); font-weight: 600; color: var(--ink); }
    #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 45; }

    /* /tv?border: everything inside the red frame should be visible; the white corner ticks mark the edge */
    body.overscan-test::after { content: 'Overscan test: all four red edges and white corners must be visible'; position: fixed; inset: 0;
      z-index: 99; border: 6px solid #ff2b2b; outline: 2px solid #fff; outline-offset: -14px; display: grid; place-content: center;
      color: #fff; font-size: 2vw; background: rgba(0, 0, 0, .35); pointer-events: none; place-content: end center; padding-bottom: 12vh; }
    /* Disconnected: decorative, never alarming (spec §7 States) */
    /* "Start the night": shown whenever the AudioContext isn't running (spec §7 States) */
    #start { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; gap: 2vh; text-align: center;
      background: rgba(10, 6, 20, .92); border: 0; color: var(--ink); cursor: pointer; font: inherit; }
    #start[hidden] { display: none; }
    #start b { font-family: var(--f-spooky); font-size: clamp(48px, 9vw, 180px); color: var(--pumpkin); font-weight: 400; }
    #start span { font-size: clamp(14px, 1.8vw, 32px); color: var(--ink-dim); }

    #catching-up { position: fixed; right: 5vw; bottom: 5vh; z-index: 20; padding: .4em .9em; border-radius: 999px;
      background: var(--night-2); color: var(--ink-dim); font-size: clamp(12px, 1.4vw, 24px); font-weight: 600;
      opacity: 0; transition: opacity 1s; }
    #catching-up.on { opacity: .85; }
  </style>
</head>
<body>
  <section id="board" aria-label="Scoreboard">
    <div class="top">
      <div class="title" id="title">Count Dracula</div>
      <div style="display: flex; gap: 1.5vw; align-items: center">
        <span class="golden-pill" id="golden-pill" hidden>🎫 <b id="golden-left"></b> golden tickets left</span>
        <span class="muted" id="muted" hidden title="Sound muted from a phone">🔇</span>
        <span class="clock" id="clock"></span>
      </div>
    </div>
    <div class="hero">
      <div class="eyebrow">Kids tonight</div>
      <div class="big num"><span id="count">–</span></div>
      <div class="pace" id="pace"></div>
      <div class="rush" id="rush" hidden><span class="label" id="rush-label"></span><div class="gauge"><div class="fill" id="rush-fill"></div></div><span class="rate" id="rush-rate"></span></div>
    </div>
    <div class="chartbox">
      <div class="legend" id="legend"></div>
      <div class="plot"><canvas id="race" role="img" aria-label="Tonight's count racing last year's ghost"></canvas></div>
    </div>
    <div class="boardbox">
      <div class="eyebrow">Costume leaderboard</div>
      <div class="rows" id="leaderboard"></div>
      <div class="cards" id="cards"></div>
    </div>
    <div class="patchbox"><canvas id="patch" aria-label="Pumpkin patch: one pumpkin per kid"></canvas></div>
  </section>

  <div id="pop" aria-live="polite"></div>
  <div id="teaser" aria-live="polite"></div>
  <div id="banner" aria-live="polite"><span class="t1">New costume spotted!</span><span class="t2" id="banner-text"></span></div>
  <div id="tomb" aria-live="polite">
    <svg viewBox="0 0 400 520" role="img" aria-label="Milestone headstone">
      <defs>
        <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#a7a3b6" /><stop offset=".55" stop-color="#85819a" /><stop offset="1" stop-color="#5f5b72" />
        </linearGradient>
      </defs>
      <path d="M62,470 L62,200 A138,138 0 0 1 338,200 L338,470 Z" fill="url(#stone)" stroke="#4d4a5e" stroke-width="8" />
      <path d="M86,462 L86,204 A114,114 0 0 1 314,204 L314,462" fill="none" stroke="#6d6982" stroke-width="5" />
      <path d="M300,250 l-14,26 l10,10 l-16,30" fill="none" stroke="#4d4a5e" stroke-width="4" stroke-linecap="round" />
      <path d="M110,430 q14,-14 30,-6 q12,-18 28,-4" fill="none" stroke="#4f7a3a" stroke-width="7" stroke-linecap="round" />
      <text class="lit spooky" x="200" y="128" text-anchor="middle" font-size="44">R.I.P.</text>
      <text class="carved" x="200" y="186" text-anchor="middle" font-size="26" letter-spacing="3">MILESTONE</text>
      <text class="lit" id="tomb-number-hi" x="201" y="312" text-anchor="middle" font-size="96">#150</text>
      <text class="carved" id="tomb-number" x="200" y="310" text-anchor="middle" font-size="96">#150</text>
      <text class="carved" x="200" y="372" text-anchor="middle" font-size="24" letter-spacing="2">KIDS SO FAR 🎃</text>
      <ellipse cx="200" cy="482" rx="196" ry="38" fill="#2f4a2b" />
      <path d="M20,482 q20,-26 40,-6 q14,-22 30,-4 M320,478 q18,-24 36,-4 q12,-18 26,0" fill="none" stroke="#3f6b2a" stroke-width="6" stroke-linecap="round" />
    </svg>
  </div>
  <div id="takeover" aria-live="assertive"><div><div class="k" id="take-k"></div><div class="h" id="take-h"></div><div class="s" id="take-s"></div></div></div>
  <div id="fx"></div>
  <canvas id="confetti"></canvas>
  <div id="catching-up">🦇 catching up…</div>
  <button id="start" hidden><b>Start the night</b><span>Click once to turn the sound on</span></button>

  <script type="module" src="/tv.js"></script>
</body>
</html>
