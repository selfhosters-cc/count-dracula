<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Count Dracula — TV</title>
  <style>
    body { margin: 0; height: 100vh; font-family: system-ui, sans-serif; background: #000; color: #f60;
           display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #event { font-size: 3vw; color: #ccc; }
    #count { font-size: 30vw; font-weight: 900; line-height: 1; }
    #link { position: fixed; top: 1vw; right: 1vw; font-size: 3vw; visibility: hidden; }
  </style>
</head>
<body>
  <div id="event"></div>
  <div id="count">–</div>
  <div id="link" title="Reconnecting">🦇</div>
  <script type="module">
    import { connectLive } from '/live.js'

    const $ = (id) => document.getElementById(id)
    const live = connectLive()
    live.on(({ state }) => {
      $('link').style.visibility = live.connected ? 'hidden' : 'visible'
      if (!state) return
      $('event').textContent = state.event.name
      $('count').textContent = state.kids.length
    })
  </script>
</body>
</html>
