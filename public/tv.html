<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Count Dracula — TV</title>
  <link rel="stylesheet" href="/vendor/fonts/fonts.css">
  <style>
    /* Layout A "Scoreboard" (spec §7), from the TV prototype (commit 1d78274). Built for 1920×1080. */
    :root {
      color-scheme: dark;
      --night: #140f26;
      --night-2: #1f1838;
      --ink: #f7efe0;
      --ink-dim: #b3aacb;
      --pumpkin: #ff7a1a;
      --grid: #2c2449;
      --f-display: "Bungee", "Arial Black", Impact, sans-serif;
      --f-spooky: "Creepster", "Bungee", Impact, fantasy;
      --f-body: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--night); color: var(--ink); font-family: var(--f-body); overflow: hidden; cursor: none; }
    .num { font-variant-numeric: tabular-nums; }
    .eyebrow { font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); font-size: clamp(11px, 1.4vw, 22px); }

    /* The frame. Padding keeps key content off the outer ~5% (TV overscan). */
    #board { position: fixed; inset: 0; padding: 4.5vh 4.5vw; display: grid;
      grid-template-columns: 34fr 66fr; grid-template-rows: auto 1fr 22vh 10vh; gap: 1.6vh 2vw; }
    .top { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 1em; }
    .title { font-family: var(--f-spooky); font-size: clamp(20px, 3.4vw, 64px); color: var(--pumpkin); letter-spacing: .03em; }
    .clock { font-family: var(--f-display); font-size: clamp(14px, 2.2vw, 36px); color: var(--ink-dim); }
    .hero { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
    .hero .big { font-family: var(--f-display); font-size: clamp(64px, 15vw, 300px); line-height: .9; }
    .pace { margin-top: 1.2vh; font-size: clamp(14px, 2.2vw, 40px); font-weight: 600; min-height: 1.3em; }
    .chartbox { min-width: 0; background: var(--night-2); border-radius: 14px; }
    .boardbox { grid-column: 1 / -1; min-width: 0; }
    .patchbox { grid-column: 1 / -1; min-width: 0; border-top: 2px solid var(--grid); }

    #count { display: inline-block; transform-origin: left center; }

    /* Celebration layer */
    #pop { position: fixed; left: 50%; top: 56%; translate: -50% -50%; opacity: 0; pointer-events: none; z-index: 30;
      text-align: center; padding: .25em .7em; border-radius: 24px; background: var(--pumpkin); color: #1d0d00;
      font-family: var(--f-display); font-size: clamp(30px, 7vw, 140px); line-height: 1; white-space: nowrap;
      box-shadow: 0 10px 60px rgba(255, 122, 26, .55); }
    #pop small { display: block; font-family: var(--f-body); font-weight: 700; font-size: .28em; letter-spacing: .14em;
      text-transform: uppercase; margin-bottom: .2em; }
    #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 45; }

    /* Disconnected: decorative, never alarming (spec §7 States) */
    #catching-up { position: fixed; right: 5vw; bottom: 5vh; z-index: 20; padding: .4em .9em; border-radius: 999px;
      background: var(--night-2); color: var(--ink-dim); font-size: clamp(12px, 1.4vw, 24px); font-weight: 600;
      opacity: 0; transition: opacity 1s; }
    #catching-up.on { opacity: .85; }
  </style>
</head>
<body>
  <section id="board" aria-label="Scoreboard">
    <div class="top">
      <div class="title">Count Dracula</div>
      <span class="clock" id="clock"></span>
    </div>
    <div class="hero">
      <div class="eyebrow">Kids tonight</div>
      <div class="big num"><span id="count">–</span></div>
      <div class="pace" id="pace"></div>
    </div>
    <div class="chartbox" id="race"></div>
    <div class="boardbox" id="leaderboard"></div>
    <div class="patchbox" id="patch"></div>
  </section>

  <div id="pop" aria-live="polite"></div>
  <canvas id="confetti"></canvas>
  <div id="catching-up">🦇 catching up…</div>

  <script type="module" src="/tv.js"></script>
</body>
</html>
