<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Count Dracula</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee;
           display: flex; flex-direction: column; align-items: center; gap: 1.5rem; padding: 2rem 1rem; }
    #count { font-size: 5rem; font-weight: 800; }
    #add { font-size: 2rem; padding: 1.5rem 3rem; border: 0; border-radius: 1rem; background: #f60; color: #111; }
    #pill { min-height: 1.5em; text-align: center; }
    #pill .waiting { background: #c80; color: #111; padding: 0.3rem 0.8rem; border-radius: 999px; font-weight: 700; }
    #pill .sent { color: #6c6; font-weight: 700; }
    #pill .down { margin-top: 0.4rem; font-size: 0.9rem; }
    #problem { color: #f66; min-height: 1.2em; }
    #who { position: fixed; inset: 0; background: #111; display: none; flex-direction: column;
           align-items: center; justify-content: center; gap: 1rem; }
    #who button, #who input { font-size: 1.5rem; padding: 0.8rem 1.5rem; border-radius: 0.6rem; width: 14rem; }
    #who button { border: 0; background: #333; color: #eee; }
  </style>
</head>
<body>
  <div id="pill"></div>
  <div id="event"></div>
  <div id="count">–</div>
  <button id="add">+1 Kid</button>
  <div id="problem"></div>

  <form id="who">
    <h1>Who's tapping?</h1>
    <button type="button" data-name="Dad">Dad</button>
    <button type="button" data-name="Mom">Mom</button>
    <button type="button" data-name="Grandma">Grandma</button>
    <input id="custom" placeholder="Someone else…" autocomplete="off">
    <button type="submit">OK</button>
  </form>

  <script type="module">
    import { connectLive } from '/live.js'
    import { createOutbox } from '/outbox.js'
    import { doorView } from '/door-view.js'

    const $ = (id) => document.getElementById(id)

    // The join key arrives as ?key=… once (QR code or tailnet hand-off) and is remembered.
    const params = new URLSearchParams(location.search)
    if (params.get('key')) localStorage.setItem('cd.joinKey', params.get('key'))
    const joinKey = localStorage.getItem('cd.joinKey') ?? ''

    let problem = ''

    async function send(entry) {
      const res = await fetch('/api/taps', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Join-Key': joinKey },
        body: JSON.stringify(entry),
        signal: AbortSignal.timeout(8_000),
      })
      problem = res.status === 403 ? 'Wrong join key: taps are kept until it is fixed' : ''
      if (res.status === 400) return // the server will never take it; don't block the queue behind it
      if (!res.ok) throw new Error(`HTTP ${res.status}`)
    }

    const clock = {
      now: () => Date.now(),
      setTimeout: (fn, ms) => setTimeout(fn, ms),
      clearTimeout: (id) => clearTimeout(id),
    }

    function start(phoneName) {
      $('who').style.display = 'none'
      const outbox = createOutbox({ send, storage: localStorage, clock, phoneName })
      const live = connectLive()

      function render() {
        const view = doorView(live.state, outbox)
        $('event').textContent = live.state?.event.name ?? ''
        $('count').textContent = view.total ?? '–'
        $('pill').innerHTML = pillHtml(outbox.status)
        $('problem').textContent = problem
      }

      live.on((update) => {
        outbox.sync(update)
        render()
      })
      setInterval(render, 500) // acks and the 5 s / 2 min thresholds
      $('add').addEventListener('click', () => {
        outbox.tap(null)
        render()
      })
      addEventListener('online', () => outbox.retryNow())
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') outbox.retryNow()
      })
      render()
    }

    function pillHtml(status) {
      if (status === 'sent') return '<span class="sent">✓ sent</span>'
      if (status === 'ok') return ''
      const n = status.waiting ?? status.down
      const line = status.down ? `<div class="down">Server's down — keep tapping, don't reload.</div>` : ''
      return `<span class="waiting">⏳ ${n} waiting to send</span>${line}`
    }

    // First open: ask once, remember on the phone.
    const savedName = localStorage.getItem('cd.phoneName')
    if (savedName) {
      start(savedName)
    } else {
      $('who').style.display = 'flex'
      const choose = (name) => {
        name = name.trim()
        if (!name) return
        localStorage.setItem('cd.phoneName', name)
        start(name)
      }
      for (const b of $('who').querySelectorAll('[data-name]')) b.addEventListener('click', () => choose(b.dataset.name))
      $('who').addEventListener('submit', (e) => {
        e.preventDefault()
        choose($('custom').value)
      })
    }
  </script>
</body>
</html>
