<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tally sheet</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icon.png">
  <style>
    /* One printed page, taped inside the door (spec §6 Night tools). Ink only, no colour needed. */
    @page { size: letter portrait; margin: 14mm; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #111; background: #fff; }
    h1 { font-size: 22pt; margin: 0 0 4pt; }
    .note { font-size: 13pt; font-weight: 700; margin: 0 0 10pt; }
    .started { font-size: 12pt; margin: 0 0 12pt; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1.5px solid #111; padding: 0 8pt; height: 15mm; font-size: 14pt; }
    th { height: auto; padding: 6pt 8pt; text-align: left; font-size: 11pt; }
    td.time { width: 30mm; white-space: nowrap; font-weight: 700; }
    td.total { width: 22mm; }
    .print { margin-top: 12pt; font-size: 12pt; padding: 8pt 14pt; }
    @media print { body { padding: 0; } .print { display: none; } }
  </style>
</head>
<body>
  <h1 id="title">Trick-or-treat tally</h1>
  <p class="note">Phone blank or dead? Tally here. Write the time you started.</p>
  <p class="started">Started at: ____________</p>
  <table>
    <thead><tr><th>Time</th><th>Tally marks</th><th>Total</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <button class="print" id="print">🖨 Print</button>
  <script type="module" src="/tally.js"></script>
</body>
</html>
