<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Count Dracula — Sound audition</title>
  <style>
    :root { --bg: #14101c; --panel: #221a2e; --panel2: #2d2340; --text: #f5efe6; --dim: #a99cbc; --orange: #ff7a1a; }
    * { box-sizing: border-box; }
    body { margin: 0 auto; max-width: 820px; padding: 16px; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1 { font-size: 24px; margin: 0 0 6px; }
    p { color: var(--dim); }
    section { background: var(--panel); border-radius: 14px; padding: 12px 14px; margin: 12px 0; }
    h2 { font-size: 16px; margin: 0 0 8px; }
    label { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid #ffffff10; }
    label:first-of-type { border-top: 0; }
    label .what { flex: 1; min-width: 0; }
    label small { display: block; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button { font: inherit; color: inherit; border: 0; border-radius: 10px; background: var(--panel2); padding: 8px 12px; cursor: pointer; }
    button.play { width: 44px; height: 40px; flex: 0 0 auto; }
    input[type=radio] { accent-color: var(--orange); width: 20px; height: 20px; }
    textarea { width: 100%; height: 220px; background: var(--bg); color: var(--text); border: 1px solid #ffffff30; border-radius: 10px;
      font: 12px ui-monospace, monospace; padding: 10px; }
    .primary { background: var(--orange); color: #1a0d00; font-weight: 700; }
  </style>
</head>
<body>
  <h1>🔊 Sound audition</h1>
  <p>Listen on the real TV if you can. Pick one sound per slot, then copy the result at the bottom and send it to
    Claude (or save it as <code>public/sounds/manifest.json</code>). Every file is CC0; sources are in
    <a href="/sounds/SOURCES.md" style="color: var(--orange)">SOURCES.md</a>. Sounds play at the loudness the TV evens them out to.</p>
  <div id="slots"></div>
  <section>
    <h2>Your picks</h2>
    <textarea id="result" readonly></textarea>
    <p><button class="primary" id="copy">Copy</button> <span id="copied"></span></p>
  </section>

  <script type="module">
    import { loadSlot } from '/web-audio.js'

    const $ = (id) => document.getElementById(id)
    const [candidates, manifest] = await Promise.all(['/sounds/candidates.json', '/sounds/manifest.json'].map((u) => fetch(u).then((r) => r.json())))
    const choice = Object.fromEntries(Object.keys(candidates).map((slot) => [slot, JSON.stringify(manifest[slot] ?? null)]))

    let ctx, out, playing
    function audio() {
      if (!ctx) {
        ctx = new AudioContext()
        out = new DynamicsCompressorNode(ctx, { threshold: -14, knee: 8, ratio: 6 })
        out.connect(ctx.destination)
      }
      return ctx
    }

    // Plays one option the way the TV would: the scale note as a short rising run, bloops at a few pitches.
    async function play(slot, entry) {
      const c = audio()
      await c.resume()
      playing?.forEach((s) => s.stop())
      const buffer = await loadSlot(c, slot, entry)
      const detunes = slot === 'note' ? [0, 200, 400, 500, 700] : slot === 'bloop' ? [-100, 200, 0] : [0]
      const step = slot === 'note' ? 0.16 : slot === 'bloop' ? 0.45 : 0
      const gain = slot === 'ambience' ? 0.6 : slot === 'tick' ? 0.4 : 1
      playing = detunes.map((detune, i) => {
        const s = new AudioBufferSourceNode(c, { buffer, detune })
        s.connect(new GainNode(c, { gain })).connect(out)
        s.start(c.currentTime + i * step)
        return s
      })
    }

    const esc = (t) => String(t).replace(/[&<>"]/g, (ch) => `&#${ch.charCodeAt(0)};`)
    $('slots').innerHTML = Object.entries(candidates)
      .map(([slot, { label, options }]) => {
        const rows = [...options.map((o) => ({ ...o, value: JSON.stringify(o.entry) })), { title: 'Generated (built in, no file)', source: options.length ? '' : 'Not recorded yet: this stand-in plays until it is', value: 'null' }]
        return `<section><h2>${esc(label)}</h2>${rows
          .map((o, i) => `<label><input type="radio" name="${slot}" value='${esc(o.value)}' ${o.value === choice[slot] ? 'checked' : ''}>
            <span class="what">${esc(o.title)}<small>${esc(o.source ?? '')}${o.original ? ` · ${esc(o.original)}` : ''}</small></span>
            <button class="play" type="button" data-slot="${slot}" data-entry='${esc(o.value)}' aria-label="Play">▶</button></label>`)
          .join('')}</section>`
      })
      .join('')

    function render() {
      const picks = Object.fromEntries(Object.entries(choice).filter(([, v]) => v !== 'null').map(([k, v]) => [k, JSON.parse(v)]))
      $('result').value = JSON.stringify(picks, null, 2)
    }
    $('slots').addEventListener('change', (e) => {
      choice[e.target.name] = e.target.value
      render()
    })
    $('slots').addEventListener('click', (e) => {
      const b = e.target.closest('.play')
      if (b) play(b.dataset.slot, JSON.parse(b.dataset.entry))
    })
    $('copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText($('result').value)
        $('copied').textContent = 'Copied'
      } catch {
        $('result').select()
        $('copied').textContent = 'Select-all done: copy it by hand'
      }
    })
    render()
  </script>
</body>
</html>
